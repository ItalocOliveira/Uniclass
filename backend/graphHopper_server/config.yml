server:
  type: default
  application_connectors:
    - type: http
      port: 8989
  admin_connectors:
    - type: http
      port: 8990

graphhopper:
  datareader.file: caminhos_unipe.osm
  import.osm.nogeo: false
  import.osm.ignored_highways: ""

  index.max_region_search: 4

  graph.encoded_values: car_access, car_average_speed, foot_access, foot_average_speed

  profiles:
    # ESTRADAS
    - name: vehicle
      weighting: custom
      turn_costs:
        vehicle_types: [motorcar]
        u_turn_costs: 60
      
      custom_model:
        distance_influence: 70
        speed:
          - if: "true"
            limit_to: car_average_speed
        priority:
          - if: "!car_access"
            multiply_by: 0

    # CALÇADAS
    - name: pedestrian
      weighting: custom
      custom_model:
        distance_influence: 15
        speed:
          - if: "true"
            limit_to: foot_average_speed
        priority:
          - if: "!foot_access"
            multiply_by: 0