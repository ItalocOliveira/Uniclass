<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa do Campus - Navegação</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./css/style-map.css">

</head>

<body>

    <!-- Painéis existentes -->
    <div id="painel-distancia">
        Restam <span id="distancia-texto"></span>
    </div>

    <div id="painel-chegada" style="display: none;">
        <div>
            <strong>Você chegou!</strong>
        </div>
        <button onclick="encerrarNavegacao()" style="margin-top:10px; padding:5px 10px; cursor:pointer;">
            Encerrar navegação
        </button>
    </div>

    <!-- BOTÃO NAVEGADOR -->
    <button id="btnNavegador" onclick="toggleNavegador()">
        Navegador
    </button>

    <!-- POP-UP -->
    <div id="popupNavegador">
        <h4>Navegação</h4>

        <select id="seletorLocais">
            <option value="">Selecione um destino</option>
        </select>

        <button class="btn-ir" onclick="irParaSelecionado()">Iniciar Rota</button>

        <hr>

        <small>Camadas:</small><br>
        <button onclick="mudarAndar(0)">Térreo</button>
        <button onclick="mudarAndar(1)">1º Andar</button>
        <button onclick="mudarAndar(2)">2º Andar</button>
    </div>

    <!-- INDICADOR DE ANDAR -->
    <div id="indicadorAndar">
        Andar: <span id="andarAtualTexto">0</span>
    </div>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./scripts/inicializacao.js"></script>
    <script src="./scripts/navegacao.js"></script>

    <script>
        function toggleNavegador() {
            document.getElementById('popupNavegador').classList.toggle('aberto');
        }

        setTimeout(() => {
            const select = document.getElementById('seletorLocais');

            if (typeof locais !== 'undefined' && locais.length > 0) {
                locais.forEach(local => {
                    const option = document.createElement('option');
                    option.value = local.properties.nome;
                    option.text = `${local.properties.nome} (Andar: ${local.properties.level})`;
                    select.appendChild(option);
                });
            }
        }, 1000);

        function irParaSelecionado() {
            const select = document.getElementById('seletorLocais');
            const nomeSala = select.value;

            if (!nomeSala) {
                alert("Selecione alguma sala na lista!");
                return;
            }

            // Inicia navegação normal
            selecionarLocal(nomeSala);

            // Fecha menu e esconde botão
            document.getElementById('popupNavegador').classList.remove('aberto');
            document.getElementById('btnNavegador').style.display = 'none';

            // Mostra andar atual
            const local = locais.find(l => l.properties.nome === nomeSala);
            if (local) {
                document.getElementById('andarAtualTexto').innerText = local.properties.level;
                document.getElementById('indicadorAndar').style.display = 'block';

                mudarAndar(parseInt(local.properties.level));
            }
        }

        function encerrarNavegacao() {
            document.getElementById('indicadorAndar').style.display = 'none';
            document.getElementById('btnNavegador').style.display = 'block';
        }
    </script>

</body>
</html>
